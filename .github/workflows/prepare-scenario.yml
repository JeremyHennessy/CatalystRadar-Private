name: Prepare separate conditional mechanical scenario
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: single-private-price-consumer
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: write
    env:
      EXPECTED_PUBLIC_CODE_SHA: fefcb3fa4c2bbe05b6f02bd5eb5d1cc53c138b95
      EXPECTED_RECEIPT_WORKFLOW_BLOB_SHA: 2cb9e886b5b496dbffe8bc84e76a8a1606b26751
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: JeremyHennessy/CatalystRadar
          ref: fefcb3fa4c2bbe05b6f02bd5eb5d1cc53c138b95
          path: .collector
          persist-credentials: false
      - name: Prepare private conditional plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import sys,json
          sys.path.insert(0,'.collector/backend')
          from private_scenario import prepare
          try: print(json.dumps(prepare()))
          except Exception:
              print('Scenario preparation blocked. No primary-book changes.');sys.exit(1)
          PY
      - name: Commit immutable plan privately
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/scenarios/*.json
          git commit -m 'Freeze separate conditional mechanical scenario'
          python3 .collector/backend/collect.py --verify-privacy
          git push origin HEAD:main
      - name: Request and verify trusted receipt once
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import sys,json
          sys.path.insert(0,'.collector/backend')
          from scenario_receipt_dispatch import record_receipt
          try: print(json.dumps(record_receipt()))
          except Exception:
              print('Receipt not verified. Do not retry automatically or claim a prospective scenario.');sys.exit(1)
          PY
      - name: Retain verified receipt privately
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git add -- data/scenario-receipts/*.json
          git commit -m 'Retain server receipt for conditional scenario'
          python3 .collector/backend/collect.py --verify-privacy
          git push origin HEAD:main
